<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MU Online Season 6 WebAssembly Client</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        #canvas-container {
            position: relative;
            width: 1024px;
            height: 768px;
            box-shadow: 0 0 20px rgba(255, 200, 0, 0.3);
            border: 2px solid #444;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            background-color: #050505;
        }

        #status-bar {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>MU Online Season 6 - Web Client</h1>
    <div id="canvas-container">
        <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>
    </div>
    <div id="status-bar">Initializing WebAssembly Engine...</div>

    <script type="text/javascript">
        var Module = {
            preRun: [],
            postRun: [],
            print: (function() {
                return function(text) {
                    if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                    console.log('[WASM]', text);
                };
            })(),
            printErr: function(text) {
                if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
                console.error('[WASM-ERR]', text);
            },
            canvas: (function() {
                var canvas = document.getElementById('canvas');
                return canvas;
            })(),
            setStatus: function(text) {
                var statusEl = document.getElementById('status-bar');
                if (statusEl) statusEl.innerHTML = text;
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        window.addEventListener('DOMContentLoaded', function() {
            if (typeof SharedArrayBuffer === 'undefined') {
                console.warn('SharedArrayBuffer is not available. COOP/COEP headers required.');
            } else {
                console.log('SharedArrayBuffer is enabled.');
            }
        });
    </script>
    <script async src="client.js"></script>
</body>
</html>
