services:
  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    env_file:
      - .env
    networks:
      - openmu-network
    ports:
      - "${ADMIN_PANEL_PORT}:80"
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "55980:55980"
    environment:
      RESOLVE_IP: ${RESOLVE_IP}
      ASPNETCORE_URLS: http://+:80
      DB_HOST: openmu-database
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET}
      # website authenticates itself at the public API under /api.
      DB_ADMIN_USER: ${POSTGRES_USER}
      DB_ADMIN_PW: ${POSTGRES_PASSWORD}
      # IMPORTANT: Comentar la primera vez que levantes los servicios
      Database__AssumeExternallyProvisioned: true
    volumes:
      - ${OPENMU_DATA_PATH}:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      - openmu-database

  openmu-database:
    image: postgres:15-alpine
    container_name: openmu-database
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: openmu
      POSTGRES_USER: postgres
    networks:
      - openmu-network
    volumes:
      - ${OPENMU_DB_PATH}:/var/lib/postgresql

  openmu-web:
    image: openmu-web:latest
    container_name: openmu-website
    env_file:
      - .env
    build:
      context: ./web
      dockerfile: Dockerfile 
    ports:
      - "${WEB_PORT}:8080"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ServerCheck__Host=openmu-startup
      - ServerCheck__Port=44406
      - TZ=${TIMEZ}
    networks:
      - openmu-network
    restart: always

networks:
  openmu-network:
