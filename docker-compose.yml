services:
  openmu-startup:
    image: munique/openmu
    container_name: openmu-startup
    env_file:
      - .env
    networks:
      - openmu-network
    ports:
      - "${ADMIN_PANEL_PORT}:8080"
      - "55901:55901"
      - "55902:55902"
      - "55903:55903"
      - "55904:55904"
      - "55905:55905"
      - "55906:55906"
      - "44405:44405"
      - "55980:55980"
    environment:
      RESOLVE_IP: ${RESOLVE_IP}
      ASPNETCORE_URLS: http://+:8080
      DB_HOST: openmu-database
      # Optional bootstrap admin panel user. Without it, the admin panel is reachable
      # without a login until the first user has been created within the panel itself.
      OPENMU_ADMIN_USER: ${OPENMU_ADMIN_USER}
      OPENMU_ADMIN_PASSWORD: ${OPENMU_ADMIN_PASSWORD}
      # Optional base32 TOTP secret, if the bootstrap user should require a second factor.
      OPENMU_ADMIN_TOTP_SECRET: ${OPENMU_ADMIN_TOTP_SECRET}
      # website authenticates itself at the public API under /api.
      DB_ADMIN_USER: ${POSTGRES_USER}
      DB_ADMIN_PW: ${POSTGRES_PASSWORD}
      # IMPORTANT: Comentar la primera vez que levantes los servicios
      Database__AssumeExternallyProvisioned: true
    volumes:
      - ${OPENMU_DATA_PATH}:/app/data-protection-keys
    working_dir: /app/
    depends_on:
      - openmu-database

  openmu-database:
    image: postgres:16-bookworm
    container_name: openmu-database
    env_file:
      - .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
    networks:
      - openmu-network
    volumes:
      - ${OPENMU_DB_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  openmu-db-backup:
    build:
      context: ./backup
      dockerfile: Dockerfile
    image: openmu-db-backup:latest
    container_name: openmu-db-backup
    restart: unless-stopped
    networks:
      - openmu-network
    environment:
      - PGHOST=openmu-database
      - PGUSER=${POSTGRES_USER}
      - PGPASSWORD=${POSTGRES_PASSWORD}
      - PGDATABASE=${POSTGRES_DB}
      - BACKUP_DIR=/backups
      - BACKUP_CRON_SCHEDULE=${BACKUP_CRON_SCHEDULE}
      - RETENTION_DAYS=${BACKUP_RETENTION_DAYS}
      - RUN_ON_STARTUP=${BACKUP_RUN_ON_STARTUP}
      - TZ=${TIMEZ}
    volumes:
      - ${OPENMU_BACKUP_PATH}:/backups
    depends_on:
      openmu-database:
        condition: service_healthy

  openmu-web:
    image: openmu-web:latest
    container_name: openmu-website
    env_file:
      - .env
    build:
      context: ./web
      dockerfile: Dockerfile 
    ports:
      - "${WEB_PORT}:8080"
    environment:
      - ASPNETCORE_URLS=http://0.0.0.0:8080
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - ServerCheck__Host=openmu-startup
      - ServerCheck__Port=44406
      - TZ=${TIMEZ}
    networks:
      - openmu-network
    restart: always
    depends_on:
      openmu-database:
        condition: service_healthy

  openmu-client:
    image: openmu-client:latest
    container_name: openmu-client
    network_mode: bridge
    env_file:
      - .env
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "${CLIENT_VITE_PORT}:4173"   # Vite preview → http://localhost:<CLIENT_VITE_PORT>/online
      - "${CLIENT_PROXY_PORT}:3000"  # WS↔TCP proxy
    environment:
      - PORT=3000
      - CLIENT_VITE_PORT=4173
      - HOSTNAME=0.0.0.0
      # ALLOW_TARGETS vacío = acepta cualquier host (solo para dev local)
      - ALLOW_TARGETS=
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${DB_HOST}:5432/${POSTGRES_DB}
      - VITE_SERVER_LIST_URL=${VITE_SERVER_LIST_URL}
    volumes:
      - ${CLIENT_DIST_PATH}:/app/dist # Caché del build: persiste entre reinicios
    restart: unless-stopped


networks:
  openmu-network: